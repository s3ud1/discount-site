
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discount Calculator</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      padding: 50px;
      background: linear-gradient(270deg, #1e3c72, #2a5298, #1e3c72);
      background-size: 600% 600%;
      animation: gradient 15s ease infinite;
    }

    @keyframes gradient {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    input[type="number"] {
      padding: 10px;
      font-size: 16px;
      width: 200px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #ffffff22;
      color: white;
      border: 1px solid white;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: white;
      color: #2a5298;
    }

    .result {
      margin-top: 20px;
      font-size: 20px;
    }

    footer {
      margin-top: 50px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <h1>Discount Calculator</h1>
  <p>Enter the original price:</p>
  <input type="number" id="price" placeholder="Enter price..." />

  <div>
    <button onclick="applyClearance()">Clearance 10%</button>
    <button onclick="applyOpenBox()">Open Box 30%</button>
    <button onclick="applyBoth()">Clearance + Open Box</button>
  </div>

  <div class="result" id="result"></div>

  <footer>&copy; sAud GH</footer>

  <script>
    function applyClearance() {
      const price = parseFloat(document.getElementById("price").value);
      if (isNaN(price)) return showError();

      const discounted = price * 0.90;
      showResult(`Price after 10% Clearance: ${discounted.toFixed(2)} SAR`);
    }

    function applyOpenBox() {
      const price = parseFloat(document.getElementById("price").value);
      if (isNaN(price)) return showError();

      const discounted = price * 0.70;
      showResult(`Price after 30% Open Box: ${discounted.toFixed(2)} SAR`);
    }

    function applyBoth() {
      const price = parseFloat(document.getElementById("price").value);
      if (isNaN(price)) return showError();

      const afterClearance = price * 0.90;
      const afterOpenBox = afterClearance * 0.70;
      showResult(`Price after 10% Clearance + 30% Open Box: ${afterOpenBox.toFixed(2)} SAR`);
    }

    function showResult(text) {
      document.getElementById("result").innerText = text;
    }

    function showError() {
      document.getElementById("result").innerText = "Please enter a valid price.";
    }
  </script>
</body>
</html>
